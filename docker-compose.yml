# version: "3" is obsolete and removed to avoid warnings
 
services:
 
  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONPATH=/backend
      - TZ=Asia/Kolkata
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - ./backend/instance:/backend/instance
    depends_on:
      - redis

  celery_worker:
    build: ./backend
    command: celery -A celery_app.celery_app worker --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONPATH=/backend
      - TZ=Asia/Kolkata
    volumes:
      - ./backend/instance:/backend/instance
    depends_on:
      - redis
      - backend

  celery_beat:
    build: ./backend
    command: celery -A celery_app.celery_app beat --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONPATH=/backend
      - TZ=Asia/Kolkata
    volumes:
      - ./backend/instance:/backend/instance
    depends_on:
      - redis
      - backend


  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    depends_on:
      - backend